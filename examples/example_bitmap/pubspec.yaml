name: xnz_image_example_bitmap
description: Bitmap-only demo for xnz_image
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  xnz_image:
    path: ../../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  xnz_image:
    path: ../../
  xnz_image_core:
    path: ../../packages/xnz_image_core

flutter:
  uses-material-design: true
  assets:
    - assets/tg.png
    - assets/giphy.gif
