name: xnz_image_example_bitmap_svg
description: Bitmap + SVG demo for xnz_image
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  xnz_image:
    path: ../../
  xnz_image_svg:
    path: ../../packages/xnz_image_svg

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  xnz_image:
    path: ../../

flutter:
  uses-material-design: true
  assets:
    - assets/fire.svg
    - assets/tg.png
